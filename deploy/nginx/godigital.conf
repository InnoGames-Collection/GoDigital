# =============================================================================
# InnoPulse Gateway — Managed Route: GoDigital Platform (Telebirr Game Center)
# Target: innoserver-serv001 (35.223.254.218)
# Ports: Web: 3700 | API: 3702 | Admin: 3703
# Compliance: INSA Cybersecurity & Telecom VAS Standards
# =============================================================================

# 1. Global HTTP (Port 80) -> HTTPS (Port 443) 301 Redirect (Mandatory for INSA)
server {
    listen 80;
    listen [::]:80;
    server_name godigital.com.et
                www.godigital.com.et
                godigital.innopulseplatform.com 
                godigital-api.innopulseplatform.com 
                api.godigital.innopulseplatform.com 
                godigital-admin.innopulseplatform.com 
                admin.godigital.innopulseplatform.com;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. Player Portal & Integrated API: godigital.innopulseplatform.com
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name godigital.com.et www.godigital.com.et godigital.innopulseplatform.com;

    ssl_certificate /etc/ssl/certs/innopulse.crt;
    ssl_certificate_key /etc/ssl/private/innopulse.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    proxy_buffer_size 128k;
    proxy_buffers 4 256k;
    proxy_busy_buffers_size 256k;

    # INSA Hardened Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Fastify API Reverse Proxy
    location /api/ {
        proxy_pass http://127.0.0.1:3702;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Frontend Single Page App (GoDigital 12 Progressive Titles)
    location / {
        proxy_pass http://127.0.0.1:3700;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_cache_bypass $http_upgrade;
    }
}

